# CI/CD自动化检查配置文件                                                                                                                                                                                                                     
# 定义项目的构建、测试、合规检查等自动化流程配置

# SCA配置
sca:
  enabled: false # 是否启用

# SonarQube配置
sonarqube:
  enabled: true # 是否启用
  ignore_file:
  - "rpc/pb"
  - "thrift/gen-go-14"
  - "thrift/gen-go"
  - "vendor"
  - "server/agent/test"
  - "server/controller/test"

# 构建配置
build:
  enabled: false # 是否启用构建检查