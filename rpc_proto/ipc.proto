syntax = "proto3";

option go_package = "scmc/rpc/pb/ipc";

package ipcbase;

service IpcBase{
	/* 查询 IPC 容器 */
	rpc List(IpcListRequest) returns(IpcListReply) {}	
	/* 创建 IPC 容器 */
	rpc Create(IpcCreateRequest) returns(IpcCreateReply) {}
	/* 移除 IPC 容器 */
	rpc Remove(IpcRemoveRequest) returns(IpcRemoveReply) {}
}

// 创建 IPC 容器
message IpcCreateRequest {
	int64	node_id = 1;
	string  name = 2;
}

message IpcCreateReply{
	string name = 1;
	string container_id = 2;
	int64	start_time = 3;
	repeated string warnings = 4;
}

// 查询 IPC 容器
message IpcListRequest {
	int64 node_id = 1;
}

message IpcNameContainerName {
	string name = 1;
	repeated string container_name = 2;
}

message IpcListReply {
	repeated IpcNameContainerName ipcname_ids = 1;
}

// 删除 IPC 容器 
message IpcContainerIdList {
    int64           node_id       = 1;
    repeated string container_ids = 2;
}

message IpcRemoveRequest {
	repeated IpcContainerIdList ids = 1; 
}

message IpcContainerFailInfo {
    string node_info      = 1;
    string container_id   = 2;
    string container_name = 3;
    string fail_reason    = 4;
}

message IpcRemoveReply {
    repeated string            ok_ids     = 1;
    repeated string            fail_ids   = 2;
    repeated IpcContainerFailInfo fail_infos = 3;
}
