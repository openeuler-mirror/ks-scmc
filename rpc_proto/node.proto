syntax = "proto3";

option go_package = "scmc/rpc/pb/node";

import "common.proto";
import "security.proto";

package node;

service Node {
    // 查询节点列表
    rpc List(ListRequest) returns (ListReply) {}
    // 添加新节点
    rpc Create(CreateRequest) returns (CreateReply) {}
    // 删除已有节点
    rpc Remove(RemoveRequest) returns (RemoveReply) {}
    // 更新节点配置
    rpc Update(UpdateRequest) returns (UpdateReply) {}
    // 获取节点状态
    rpc Status(StatusRequest) returns (StatusReply) {}
    // 获取CPU MEM DISK使用情况
    rpc Usage(UsageRequest) returns (UsageReply) {}

    // 安全配置
    rpc UpdateFileProtect(UpdateFileProtectRequest) returns (UpdateFileProtectReply) {}  // 文件保护
    rpc UpdateNetworkRule(UpdateNetworkRuleRequest) returns (UpdateNetworkRuleReply) {}  // 网络访问规则
    rpc UpdateNetworkProcessWhiteList(UpdateNetworkProcessWhiteListRequest) returns (UpdateNetworkProcessWhiteListReply) {}  // 网络访问规则
    rpc UpdateProcessWhiteList(UpdateProcessWhiteListRequest) returns (UpdateProcessWhiteListReply) {}  
    
    rpc GetFileProtect(GetFileProtectRequest) returns (GetFileProtectReply) {}  // 获取文件保护规则
    rpc GetNetworkRule(GetNetworkRuleRequest) returns (GetNetworkRuleReply) {}  // 获取网络访问规则
    rpc GetNetworkProcessWhiteList(GetNetworkProcessWhiteListRequest) returns (GetNetworkProcessWhiteListReply) {}  // 获取网络访问规则
    rpc GetNodeProcessWhiteList(GetProcessWhiteListRequest) returns (GetProcessWhiteListReply) {}  
    rpc GetNodeSecurityConfig(GetNodeSecurityConfigRequest) returns (GetNodeSecurityConfigReply) {}  // 获取节点全部配置
    rpc GetNodeDefaultPort(GetNodeDefaultPortRequest) returns (GetNodeDefaultPortReply) {}    
    rpc GetNodeDefaultProcessWhiteList(GetNodeDefaultProcessWhiteListRequest) returns (GetNodeDefaultProcessWhiteListReply) {}  
    rpc GetNodeDefaultNetProWhiteList(GetNodeDefaultNetProWhiteListRequest) returns (GetNodeDefaultNetProWhiteListReply) {}    
}

message ListRequest {}

message ListReply {
    repeated NodeInfo nodes = 1;
}

message CreateRequest {
    string name    = 1;
    string address = 2;
    string comment = 3;
    string uuid    = 4;  // 内部RPC使用
}

message CreateReply {
    int64 id = 1;
}

message RemoveRequest {
    repeated int64 ids  = 1;
    string         uuid = 2;  // 内部RPC使用
}

message RemoveReply {}

message StatusRequest {
    repeated int64 node_ids = 1;
}

message StatusReply {
    repeated NodeStatus status_list = 1;
}

message UsageRequest {
    int64 id         = 1;
    int64 start_time = 2;  // 起始时间 UNIX时间戳
    int64 end_time   = 3;  // 结束时间 UNIX时间戳
}

message SecurityConfig {
    bool disable_external_network = 1;  // 禁止访问外部网络
    bool disable_cmd_operation    = 2;  // 禁止命令行控制容器(启停控制)

    security.ProcProtection  proc_protection  = 11;  // 进程保护
    security.ProcProtection  nproc_protection = 12;  // 网络进程保护
    security.FileProtection  file_protection  = 13;  // 文件防篡改保护
    security.NetworkRuleList network_rule     = 14;  // 网络访问规则
}

message UsageReply {
    NodeStatus status = 1;
}

message UpdateRequest {
    int64         node_id   = 1;
    string        name      = 2;
    string        comment   = 3;
    ResourceLimit rsc_limit = 4;
}

message UpdateReply {}

message UpdateFileProtectRequest {
    int64 node_id      = 1;
    // int64 container_id = 2;
    SecurityConfig    security_config = 3;   //节点安全配置
}

message UpdateFileProtectReply {}

message UpdateNetworkRuleRequest {
    int64 node_id      = 1;
    //int64 container_id = 2;
    SecurityConfig    security_config = 2;   //节点安全配置
}

message UpdateNetworkRuleReply {}

/***** DATA TYPES *****/

message NodeInfo {
    int64  id          = 1;
    string name        = 2;
    string address     = 3;
    string comment     = 4;
    int64  unread_warn = 5;

    NodeStatus    status    = 21;
    ResourceLimit rsc_limit = 22;  // 节点资源限制配置
}

enum NodeState {
    Offline = 0;
    Unknown = 1;
    Online  = 10;
}

message ContainerStat {
    int64 total   = 1;
    int64 running = 2;
}

message CpuStat {
    double total           = 1;
    double used            = 2;
    double used_percentage = 3;
}

message MemoryStat {
    uint64 total           = 1;  // 单位MB
    uint64 used            = 2;  // 单位MB
    uint64 free            = 3;  // 单位MB
    double used_percentage = 4;
}

message DiskStat {
    uint64 total           = 1;  // 单位MB
    uint64 used            = 2;  // 单位MB
    uint64 free            = 3;  // 单位MB
    double used_percentage = 4;
}

message NodeStatus {
    int64 node_id = 1;
    int64 state   = 2;  // NodeState

    ContainerStat container_stat = 3;
    CpuStat       cpu_stat       = 4;
    MemoryStat    mem_stat       = 5;
    DiskStat      disk_stat      = 6;

    // TODO network, etc;
}

message ResourceLimit {
    double cpu_limit    = 1;  // CPU使用核心数
    double memory_limit = 2;  // 内存限制 单位MB
    double disk_limit   = 3;  // 磁盘限制 单位MB
}

message Log {
    int64  id             = 1;
    int64  level          = 2;  // 日志等级 1:info 2:warn
    int64  node_id        = 3;
    string node_info      = 4;  // 节点名或IP
    string container_name = 5;
    string username       = 6;  // 操作用户
    string event_type     = 7;  // 事件/操作类型
    int64  event_status   = 8;  // 事件/操作状态
    string detail         = 9;
    bool   have_read      = 10;
    int64  create_at      = 11;
    int64  update_at      = 12;
}

message GetFileProtectRequest {
    int64 node_id      = 1;
}

message GetFileProtectReply {
    security.FileProtection  file_protection  = 13;  // 文件防篡改保护
    
}

message GetNetworkRuleRequest {
     int64 node_id      = 1;
}

message GetNetworkRuleReply {
    security.NetworkRuleList network_rule     = 1;  // 网络访问规则
}

message GetNodeSecurityConfigRequest {
     int64 node_id      = 1;
}

message GetNodeSecurityConfigReply {
    SecurityConfig    security_config = 1;   //节点安全配置
}

message PortStatus {
    uint32 port = 1;
    bool blocked = 2;
}

message GetNodeDefaultPortRequest{
    int64 node_id       = 1;
}

message GetNodeDefaultPortReply{
    repeated PortStatus blocked_ports = 1;
}

message UpdateProcessWhiteListRequest{
    int64   node_id = 1;
    SecurityConfig  security_config =   2;   
}
message UpdateProcessWhiteListReply{
    
}
message GetProcessWhiteListRequest{
    int64   node_id =   1;   
}
message GetProcessWhiteListReply{
    security.ProcProtection  proc_protection    =   1;  // 进程保护
}

message GetNodeDefaultProcessWhiteListRequest{
    int64   node_id =   1;
}

message GetNodeDefaultProcessWhiteListReply{
    repeated string process_names   =   1;
}


message UpdateNetworkProcessWhiteListRequest{
    int64   node_id                 =   1;
    SecurityConfig  security_config =   2;   
}

message UpdateNetworkProcessWhiteListReply{
    repeated string process_names   =   1;
}

message GetNetworkProcessWhiteListRequest{
    int64   node_id =   1;
}

message GetNetworkProcessWhiteListReply{
    security.ProcProtection  nproc_protection = 1;  // 网络进程保护
}

message GetNodeDefaultNetProWhiteListRequest{
    int64   node_id =   1;
}

message GetNodeDefaultNetProWhiteListReply{
    repeated string process_names   =   1;
}