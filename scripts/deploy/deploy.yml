---
- hosts: all
  max_fail_percentage: 0  # 任意步骤失败即中止
  gather_facts: no
  tasks:
    - setup:
        gather_subset:
          - distribution
    - include_tasks: steps/00_install_packages.yml
      tags: install
    - include_tasks: steps/10_mysql_init.yml
      tags: mysql
    - include_tasks: steps/11_mysql_replication.yml
      when: cluster.enabled == true
      tags: mysql
    - include_tasks: steps/12_mysql_create_db.yml
      tags: mysql
    - include_tasks: steps/20_image_registry.yml
      tags: image
    - include_tasks: steps/21_image_sync.yml
      when: cluster.enabled == true
      tags: image
    - include_tasks: steps/30_keepalived.yml
      when: cluster.enabled == true
      tags: vip
    - include_tasks: steps/40_setup_controller.yml
    - include_tasks: steps/41_setup_agent.yml
