---
- name: MYSQL 停止服务
  service: name=mysqld state=stopped
- name: MYSQL 初始化
  shell: |
    set -e
    MYSQLD=$(whereis -b mysqld | awk '{print $NF}')
    if [[ -z ${MYSQLD} ]]; then
      echo "找不到 mysqld"
      exit 1
    fi
    firewall-cmd --permanent --add-service=mysql >/dev/null 2>&1 || true
    firewall-cmd --reload >/dev/null 2>&1 || true
    # 确保日志目录及父目录权限正确
    mkdir -p /var/log/mysql
    chown -R mysql:mysql /var/log/mysql
    chmod -R 755 /var/log/mysql  # 目录权限
    # 确保数据目录及父目录权限正确
    mkdir -p /var/lib/mysql
    chown -R mysql:mysql /var/lib/mysql
    chmod -R 700 /var/lib/mysql  # MySQL数据目录通常需要更严格的权限（700）
    # 确保PID文件目录存在且有权限
    mkdir -p /var/run/mysqld
    chown -R mysql:mysql /var/run/mysqld
    chmod 755 /var/run/mysqld
    rm -rf /var/lib/mysql/*
    cat > /etc/my-kylin.cnf << EOF
    [mysqld]
    datadir=/var/lib/mysql
    socket=/var/lib/mysql/mysql.sock

    log-error=/var/log/mysql/mysqld.log
    pid-file=/var/run/mysqld/mysqld.pid
    EOF
    sed -i 's#$MYSQLD_OPTS#--defaults-file=/etc/my-kylin.cnf --basedir=/usr --pid-file=/run/mysqld/mysqld.pid#g' /usr/lib/systemd/system/mysqld.service
    sed -i 's#ExecStart=/usr/libexec/mysqld --basedir=/usr#ExecStart=/usr/libexec/mysqld --defaults-file=/etc/my-kylin.cnf --basedir=/usr --pid-file=/run/mysqld/mysqld.pid#g' /usr/lib/systemd/system/mysqld.service
    systemctl daemon-reload
    ${MYSQLD} --defaults-file=/etc/my-kylin.cnf --initialize-insecure --user=mysql
- name: MYSQL 启动服务
  service: name=mysqld state=restarted enabled=true
- name: MYSQL 配置用户
  shell: |
    mysql -S /var/lib/mysql/mysql.sock -uroot << EOF
    ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql.root_password }}';
    CREATE USER 'root'@'%' IDENTIFIED BY '{{ mysql.root_password }}';
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;
    EOF
