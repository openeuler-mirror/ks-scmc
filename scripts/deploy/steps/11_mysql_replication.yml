---
- name: MYSQL 更新配置文件(高可用)
  template:
    src: template/mysql-server.conf.j2
    dest: /etc/my.cnf
    owner: root
    group: root
    mode: '0644'
    backup: true
- name: MYSQL 重启服务(高可用)
  service: name=mysqld state=restarted
- name: MYSQL 权限配置(高可用)
  shell: |
    set -e
    mysql -uroot -p'{{ mysql.root_password }}' << EOF
    CREATE USER 'replacation'@'{{ other_host }}' IDENTIFIED BY 'replacation.2023';
    GRANT REPLICATION SLAVE ON *.* TO replacation@'{{ other_host }}';
    FLUSH PRIVILEGES;
    EOF
- name: MYSQL 主从复制(高可用)
  shell: |
    set -e
    MASTER_STATUS=$(mysql -h{{ other_host }} -uroot -p'{{ mysql.root_password }}' -e 'SHOW MASTER STATUS' | sed '1d')
    MASTER_LOG_FILE=$(echo ${MASTER_STATUS} | awk '{print $1}')
    MASTER_LOG_POS=$(echo ${MASTER_STATUS} | awk '{print $2}')

    mysql -uroot -p'{{ mysql.root_password }}' << EOF
    CHANGE MASTER TO MASTER_HOST='{{ other_host }}',
      MASTER_USER='replacation',
      MASTER_PASSWORD='replacation.2023',
      MASTER_LOG_FILE='${MASTER_LOG_FILE}',
      MASTER_LOG_POS=${MASTER_LOG_POS};
    START SLAVE;
    FLUSH PRIVILEGES;
    EOF

    SLAVE_STAUTS=$(mysql -uroot -p'{{ mysql.root_password }}' -e "SHOW SLAVE STATUS \G" | grep "Slave_IO_Running")
    [[ "$SLAVE_STAUTS" =~ "Yes" ]] || exit 1
