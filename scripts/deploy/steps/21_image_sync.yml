---
- name: IMAGE 检查镜像同步依赖包(高可用)
  shell: rpm -q xinetd lsyncd
- name: IMAGE 配置xinetd(高可用)
  copy:
    dest: /etc/xinetd.d/rsync
    owner: root
    group: root
    mode: '0644'
    backup: yes
    content: |
      service rsync
      {
        disable           = no
        flags             = IPv4
        socker_type       = stream
        wait              = no
        user              = root
        server            = /usr/bin/rsync
        server_args       = --daemon
        log_on_failure    += USERID
      }
- name: IMAGE 启动xinetd(高可用)
  service: name=xinetd state=restarted enabled=true
- name: IMAGE 配置rsyncd(高可用)
  copy:
    dest: /etc/rsyncd.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
    content: |
      [scmc-images]
      path        = {{ image_dir }}
      hosts allow = {{ other_host }}
      hosts deny  = *
      list        = true
      uid         = root
      gid         = root
      read only   = false
- name: IMAGE 启动rsyncd(高可用)
  service: name=rsyncd state=restarted enabled=true
- name: IMAGE 初始化rsync(高可用)
  shell: |
    rsync -auvz {{ image_dir }} {{ other_host }}::scmc-images
    rsync -auvz {{ other_host }}::scmc-images {{ image_dir }}
- name: IMAGE 配置lsyncd(高可用)
  copy:
    dest: /etc/lsyncd.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
    content: |
      settings {
        logfile = "/var/log/lsyncd/lsyncd.log",
        statusFile = "/var/log/lsyncd/lsyncd.stat",
        statusInterval = 15,
        maxProcesses = 5,
      }

      sync {
        default.rsync,
        delay = 5,
        source = "{{ image_dir }}",
        target = "{{ other_host }}::scmc-images",
        exclude = '.*',

        rsync = {
          archive = true,
          compress = true,
          update = true,
        }
      }
- name: IMAGE 启动lsyncd(高可用)
  service: name=lsyncd state=restarted enabled=true
