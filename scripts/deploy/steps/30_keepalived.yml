---
- name: KEEPALIVED 设置权重值
  set_fact:
    keepalived_priority: "{{ '100' if (ansible_play_hosts.index(inventory_hostname) == 0) else '90' }}"

- name: KEEPALIVED 配置虚拟IP(高可用)
  template:
    src: template/keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: KEEPALIVED 创建脚本目录
  file:
    path: /etc/keepalived/scripts
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: KEEPALIVED 部署服务检测脚本
  template:
    src: template/check_service.sh.j2
    dest: /etc/keepalived/scripts/check_service.sh
    owner: root
    group: root
    mode: '0755'

- name: KEEPALIVED 部署 MySQL Master 脚本 
  template:
    src: template/mysql_master.sh.j2
    dest: /etc/keepalived/scripts/mysql_master.sh
    owner: root
    group: root
    mode: '0755'

- name: KEEPALIVED 部署 MySQL Backup 脚本
  template:
    src: template/mysql_slave.sh.j2
    dest: /etc/keepalived/scripts/mysql_slave.sh
    owner: root
    group: root
    mode: '0755'

- name: KEEPALIVED 启用虚拟IP(高可用)
  service: name=keepalived state=restarted enabled=true

- name: KEEPALIVED 服务属性配置支持重启
  shell: |
    mkdir -p /etc/systemd/system/keepalived.service.d
    cat > /etc/systemd/system/keepalived.service.d/restart.conf << EOF
    [Service]
    Restart=on-failure
    RestartSec=5s
    EOF
    systemctl daemon-reload

- name: 修改网卡配置文件,启动网卡需要拉起keepalived服务
  shell: |
    set -e
    NICFG="/etc/sysconfig/network-scripts/ifcfg-{{ cluster.virtual_ip_nic }}"
    KEEPALIVED_RESTART_CMD="systemctl restart keepalived.service > /dev/null 2>&1"
    
    # 检查配置文件是否存在
    if [ ! -f "$NICFG" ]; then
      echo "Warning: Network config file $NICFG does not exist"
      exit 0
    fi
    
    # 检查是否存在 keepalived 重启脚本
    if ! grep -q "$KEEPALIVED_RESTART_CMD" "$NICFG"; then
      # 如果不存在，添加脚本配置
      echo "" >> "$NICFG"
      echo "$KEEPALIVED_RESTART_CMD" >> "$NICFG"
    fi
  args:
    executable: /bin/bash
