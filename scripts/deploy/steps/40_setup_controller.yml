---
- name: CONTROLLER 数据库密码加密
  run_once: true
  shell: ks-scmc-encrypt '{{ mysql.scmc_password }}'
  register: MYSQL_SCMC_PASSWORD_EN
- name: CONTROLLER 更新后台服务配置文件
  template:
    src: template/server.toml.j2
    dest: /etc/ks-scmc/server.toml
    owner: root
    group: root
    mode: '0644'
    backup: true
- name: CONTROLLER 启动后台服务
  service: name=ks-scmc-controller state=restarted enabled=true
- name: CONTROLLER 创建管理员用户
  run_once: true
  shell: |
    set -e
    SERVER_ADDR="127.0.0.1:10050"
    BIN="ks-scmc-user"

    cd {{ script_dir }}
    # 创建三权角色
    ${BIN} -s ${SERVER_ADDR} -c create_role "$(cat create_sysadm_r.json)"
    ${BIN} -s ${SERVER_ADDR} -c create_role "$(cat create_secadm_r.json)"
    ${BIN} -s ${SERVER_ADDR} -c create_role "$(cat create_audadm_r.json)"

    # 创建管理员用户
    ${BIN} -s ${SERVER_ADDR} -c create_admin "{}"
- name: CONTROLLER 复制镜像签名公钥
  when: image_verify_pubkey|length > 0
  run_once: true
  copy:
    src: '{{ image_verify_pubkey }}'
    dest: '{{ image_dir }}/public-key.txt'
