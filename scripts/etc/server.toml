[log]
basedir = "/var/log/ks-scmc"
level   = "info"
stdout  = false

[tls]
enable = false
ca = ""
server_cert = ""
server_key = ""

[agent]
host = "0.0.0.0"
port = 10051

[controller]
host = "0.0.0.0"
port = 10050
super-user = true

[mysql]
addr = "127.0.0.1:3306"
user = "ks-scmc"
# 通过ks-scmc-encrypt加密的密码
password = ""
db = "ks-scmc"

[sqlite]
path = "/var/lib/ks-scmc/data.db"

[cadvisor]
addr = "127.0.0.1:8080"

[influxdb]
addr = "127.0.0.1:8086"
